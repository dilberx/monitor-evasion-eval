[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monitor-evasion-eval"
version = "0.1.0"
description = "Evaluation harness for LLM agent monitor evasion under varied visibility modes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.280",
    "openai>=1.40.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monitor_evasion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
